name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # GitHub 的 schedule 用 UTC;这里设为 UTC 08:00 = 北京时间 16:00。按需调整。
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom 可选,用于校验生成的 Mermaid 图;仓库里没有图表需求可以去掉。
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        # --update 同时处理首次生成(仓库还没有 openwiki/ 目录时)。
        run: openwiki bitchat --update --print
        env:
          # 本机 ~/.openwiki/.env 里的 OpenAI key 只对本地 CLI 生效,
          # CI 是独立的云端环境,必须在仓库 Settings > Secrets 里单独配置 OPENAI_API_KEY。
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 不需要 CI 遥测可取消下一行注释:
          # OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
