name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # GitHub 的 schedule 用 UTC;这里设为 UTC 08:00 = 北京时间 16:00。按需调整。
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom 可选,用于校验生成的 Mermaid 图;仓库里没有图表需求可以去掉。
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        # --update 同时处理首次生成(仓库还没有 openwiki/ 目录时)。
        run: openwiki bitchat --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
          
      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
